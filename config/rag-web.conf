################################################################################
# RAG Query Configuration
################################################################################
# This configuration file contains all settings for the RAG query system.
# Settings can be overridden by environment variables.

################################################################################
# DATABASE CONNECTIONS
################################################################################

[mongodb]
uri = mongodb://localhost:27017
database = paper_db
collection = papers

[milvus]
# Milvus vector database configuration
host = localhost
port = 19530
workspace = lightrag
# Connection timeout in seconds
timeout = 30
# Maximum retry attempts
max_retries = 3

# Parallel entity search settings
# Maximum number of worker threads for parallel collection search
# Set to 0 or empty to use number of collections (auto)
# Recommended: 5-10 for most systems
entity_search_max_workers = 10

[redis]
# Redis key-value storage configuration
host = localhost
port = 6379
# Database number (0-15)
db = 0
# Connection timeout in seconds
timeout = 10
# Maximum connections in pool
max_connections = 50

[neo4j]
# Neo4j graph database configuration
uri = bolt://localhost:7687
username = neo4j
password = changeme
# Maximum connections in pool
max_connection_pool_size = 100
# Connection timeout in seconds
connection_timeout = 30.0
# Database name (leave empty for default)
database =

################################################################################
# EMBEDDING MODELS
################################################################################

[embedding]
# Content embeddings for chunks and entity descriptions
chunk_model = BAAI/bge-m3
chunk_model_device = cuda:0
chunk_model_max_length = 768

# Label embeddings for entity names
label_model = ncbi/MedCPT-Query-Encoder
label_model_device = cuda:0
label_model_max_length = 256

# Stage 2 semantic community discovery embeddings
# Uses longer context for shuffled text combinations
stage2_model = BAAI/bge-m3
stage2_model_device = cuda:0
stage2_model_max_length = 2048

# Embedding dimension (must match model output)
embedding_dim = 1024

# Batch size for embedding computation
batch_size = 32

################################################################################
# QUERY PARAMETERS (DEFAULTS)
################################################################################

[query]
# Default query mode: local, global, hybrid, naive, mix, bypass
default_mode = mix

# Number of entities/relationships to retrieve
top_k = 10

# Structured detailed logging (optional)
# Directory for detailed per-stage logs (empty = disabled)
# When enabled, each query creates: {log_dir}/{query_id}/*.{json|jsonl}
log_dir =

# Number of text chunks to retrieve
chunk_top_k = 20

# Token budgets for context
max_entity_tokens = 2000
max_relation_tokens = 2000
max_total_tokens = 8000

# Chunk picking method: WEIGHT or VECTOR
# WEIGHT: Linear gradient weighted polling (KG-guided)
# VECTOR: Cosine similarity (query-focused, RECOMMENDED)
kg_chunk_pick_method = ENTITY_OVERLAP

# Maximum number of related chunks per entity/relationship
max_related_chunks = 5
min_related_chunks = 1

# Maximum number of KG-related chunks to retrieve (VECTOR/WEIGHT method)
# This controls how many chunks are selected from entity/relationship sources
# before merging with vector search chunks
# Higher = more context but slower and more tokens
# Recommended: 50-200
kg_chunk_top_k = 2000

# Cosine similarity threshold for vector search (0.0-1.0)
# Only return results with similarity >= threshold
cosine_threshold = 0.5

# Query-guided chunk pre-filtering (PERFORMANCE OPTIMIZATION)
# When enabled, uses LLM query expansion + vector search to pre-filter
# entity-related chunks before fetching vectors, reducing latency by ~13-14x
# This addresses the bottleneck where 100K+ vectors are fetched to select 50 chunks
enable_candidate_filtering = true

# Candidate pool size for vector search (per query expansion)
# Total candidates = candidate_top_k (distributed across expanded queries)
# Example: candidate_top_k=1000 with 2 queries = ~500 per query
# Recommended: 1000-2000 (balances recall and speed)
candidate_top_k = 2000

# Query expansion settings
# Two modes available:
#
# 1. LEGACY MODE (fixed count):
#    Set num_query_expansions to a fixed number
#    LLM generates exactly that many queries
#
# 2. FLEXIBLE MODE (recommended):
#    Set min_query_expansions and max_query_expansions
#    LLM generates between min and max based on query complexity
#    - Simple queries: generates fewer variations (minimum)
#    - Complex multi-entity/comparison queries: generates more (up to maximum)
#    - Uses atomic decomposition for better retrieval coverage
#
# The original query is ALWAYS included alongside expansions
# Total queries used = expansions + 1 (original)
#
# Recommended for flexible mode:
# - min_query_expansions: 3-5 (ensures minimum coverage)
# - max_query_expansions: 8-12 (allows scaling for complex queries)
# - Higher max = better recall for multi-entity queries but slower

# Legacy fixed mode (used if min/max not set)
num_query_expansions = 5

# Flexible mode (recommended)
# Set both to enable flexible expansion based on query complexity
min_query_expansions = 3
max_query_expansions = 10

# Minimum intersection size to use filtering
# If intersection(candidates, entity_chunks) < this, fall back to entity chunks
# Prevents over-filtering when overlap is too small
# Recommended: 50-100
min_intersection_size = 100

# High similarity bypass threshold (0.0-1.0)
# Chunks with cosine similarity >= this threshold are ALWAYS included,
# even if they don't appear in entity-related chunks
# This ensures highly relevant chunks are never filtered out by entity constraints
# Set to 1.0 to disable this bypass (strict entity-only filtering)
# Recommended: 0.90-0.95 for biomedical queries
high_similarity_threshold = 0.7

# Maximum tokens for query expansion LLM call
# Query expansion uses JSON mode which has formatting overhead
# Higher values needed for gene lists with many entities
# Recommended: 800-1500 (main LLM uses max_tokens from [llm] section)
max_tokens_query_expansion = 5000

# Maximum entity description length in LLM prompt
# GO terms and pathways can have very long descriptions (100+ genes)
# Truncate to save tokens and reduce prompt size
# Set to 0 for no limit, recommended: 200-500 characters
max_entity_description_length = 300

# HyDE (Hypothetical Document Embeddings) configuration
# HyDE generates hypothetical answers to questions and uses them for retrieval
# This bridges the linguistic gap between questions and answer chunks
# Significant improvement over query expansion alone (+20-25% coverage)

# Enable HyDE for Milvus vector search
enable_hyde = true

# Number of HyDE hypothetical answers to generate
# Each HyDE emphasizes different aspects/mechanisms
# Recommended: 3-5 for good coverage without excessive queries
min_hyde_expansions = 3
max_hyde_expansions = 5

# Maximum tokens for HyDE generation
# HyDE generates 2-3 sentence answers per query
# Higher values for complex multi-entity questions
# Recommended: 1000-1500
max_tokens_hyde = 4000

# HyDE generation temperature
# Controls diversity of hypothetical answers
# Lower = more conservative, Higher = more diverse
# Recommended: 0.3-0.5 for biomedical questions
hyde_temperature = 0.5

# Query Decomposition for Reranking
# Decomposes complex questions into atomic sub-questions for more targeted reranking
# Different from query expansion: expansion rephrases the same question (vocabulary diversity),
# decomposition breaks multi-part questions into separate components (structural breakdown)
#
# Use cases:
# - Comparison questions: "A vs B?" -> "What is A?" + "What is B?"
# - List questions: "X in species A, B, C?" -> separate query per species
# - Mechanistic questions: "How do A and B together affect C?" -> "A->C" + "B->C" + "A+B->C"
#
# When enabled:
# - Retrieval (Milvus/ES): Uses query expansion + HyDE (for diversity)
# - Reranking: Uses decomposed queries (for precision on complex questions)
#
# When disabled:
# - Both retrieval and reranking use query expansion + HyDE
enable_query_decomposition = true

# Maximum number of atomic sub-questions to generate
# Simple questions may only decompose to 2-3 queries
# Complex comparison/list questions may decompose to 6+ queries
# Recommended: 6-8 for good balance between coverage and speed
max_decomposed_queries = 5

# Query decomposition temperature
# Controls creativity in identifying sub-components
# Lower = strict decomposition, Higher = more creative sub-questions
# Recommended: 0.3-0.5 for scientific questions
decomposition_temperature = 0.3

# Maximum tokens for decomposition response
# Response includes question type, complexity analysis, and atomic questions
# Recommended: 800-1200
max_tokens_decomposition = 4000

# Neo4j entity expansion via graph traversal
# Discovers related entities not mentioned in query by traversing relationships
# Set to 0 to disable, 1 for single-hop, 2-3 for multi-hop
neo4j_entity_expansion_hops = 1

# Minimum relationship weight percentile for discovered entities
# Only entities with weight >= this percentile are added
# 0.1 = top 90% (exclude bottom 10% - very rare)
# 0.5 = top 50% (above median)
# Recommended: 0.1-0.3
neo4j_expansion_min_weight_percentile = 0.1

# Maximum relationship weight percentile (filter out overly common entities)
# Entities with weight >= this percentile are too generic
# 0.95 = exclude top 5% (very common)
# 0.90 = exclude top 10%
# Recommended: 0.90-0.95
neo4j_expansion_max_weight_percentile = 0.95

# Maximum entities to discover per hop
neo4j_expansion_max_per_hop = 20

# Relationship types to traverse (comma-separated)
# Available: REGULATES, INTERACTS_WITH, PART_OF, MEMBER_OF, etc.
neo4j_expansion_relationship_types = REGULATES,INTERACTS_WITH,PART_OF


################################################################################
# LLM
################################################################################
# This section is INTENTIONALLY left commented out: an API key must never be
# committed, and the endpoint is a per-user choice. Configure it through the
# BIOGNOSIA_LLM_* variables in .env instead — they populate exactly these keys,
# and environment values always win over anything written here.
#
# Where it is used:
#   - the plain-Python entry point (examples/query.py)
#   - the MCP server when MCP_LLM_MODE=standalone
# In the MCP server's default sampling mode no LLM provider is built at all;
# every completion is requested from the connected MCP client instead.
#
# [llm]
# provider = openai            ; openai | groq | anthropic | ollama
#                              ; use "openai" for ANY OpenAI-compatible endpoint
#                              ; (OpenAI, vLLM, LM Studio, Ollama's /v1, proxies)
# model = gpt-4o-mini
# base_url =                   ; e.g. http://localhost:11434/v1 — MUST end in /v1
# api_key =                    ; leave empty here; set BIOGNOSIA_LLM_API_KEY
# timeout = 300                ; seconds, per API call
# enable_cot = false           ; false = strip <think>...</think> from answers
#
# Optional. OMITTING one means "do not send this parameter to the API", which is
# what lets reasoning models that reject temperature/max_tokens work. Setting
# max_completion_tokens makes max_tokens be ignored.
# temperature = 0.2
# top_p = 1.0
# max_tokens = 8192
# max_completion_tokens =

################################################################################
# AUTO MODE (LLM FUNCTION CALLING FOR INTELLIGENT ROUTING)
################################################################################

[auto_mode]
# Enable auto mode by default (uses LLM function calling to decide routing)
# When enabled, LLM chooses between: bypass, entities_only, or full retrieval
enabled = true

# Uses main LLM config from [llm] section for routing decisions
# The model must support OpenAI-compatible function calling; a model without it
# degrades gracefully to full retrieval (mix mode)

# Tool decision logging
# Log each routing decision for monitoring and debugging
log_tool_decisions = true
tool_decision_log_dir =

################################################################################
# RERANKING (MUST-HAVE)
################################################################################

[rerank]
# Enable reranking by default
enable_by_default = true

# Reranking provider: local, jina, cohere, aliyun
# - local: Run rerank model locally on GPU/CPU
# - jina: Jina AI reranker API
# - cohere: Cohere reranker API
# - aliyun: Alibaba Cloud DashScope reranker API
provider = local

# Model name (provider-specific)
# Local models (HuggingFace):
#   - jinaai/jina-reranker-v2-base-multilingual (recommended)
#   - BAAI/bge-reranker-v2-m3 (multilingual)
#   - BAAI/bge-reranker-large
#   - cross-encoder/ms-marco-MiniLM-L-12-v2
# Jina: jina-reranker-v2-base-multilingual
# Cohere: rerank-v3.5, rerank-multilingual-v3.0
# Aliyun: gte-rerank, gte-rerank-hybrid
model = jinaai/jina-reranker-v2-base-multilingual

# Device for local model (local provider only)
# Options: cuda:0, cuda:0, cpu
# Use cuda:N for GPU N, or cpu for CPU-only inference
device = cuda:0

# Maximum sequence length for local model (local provider only)
# Trade-off between speed and accuracy
# Typical values: 512 (fast), 1024 (balanced), 2048 (thorough)
# NOTE: For very long queries (gene lists), use 1024 to avoid CUDA errors
max_length = 1024

# Batch size for local model inference (local provider only)
# Higher values = faster but more VRAM usage
# Adjust based on available GPU memory
batch_size = 512

# Number of parallel workers for reranking (local provider only)
# Each worker loads the model independently for parallel scoring
# Set to 0 to disable worker pool (uses sequential reranking)
# Recommended: 5-10 for CPU, 2-4 for GPU (due to VRAM limits)
# Trade-off: More workers = faster but more memory usage
num_workers = 8

# API key for cloud reranking services (jina, cohere, aliyun)
# Not needed for local provider
api_key =

# Base URL (optional, for custom endpoints)
# Local provider: Not used
# Jina: https://api.jina.ai/v1/rerank
# Cohere: https://api.cohere.ai/v1/rerank
# Aliyun: https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank
base_url =

# Minimum relevance score threshold (0.0-1.0)
# Chunks with score below this will be filtered out
min_score = 0.5

# Maximum number of documents to rerank
# Set to 0 or empty for no limit
max_documents = 0

# Early stopping target for multi-query reranking
# When reranking chunks against multiple query expansions,
# stop early if this many documents pass the min_score threshold
# This significantly speeds up reranking (average 2-3 queries instead of 5+)
# Higher values = more thorough but slower
# Recommended: 5-10
early_stop_target = 5

################################################################################
# TWO-STAGE RERANKING (CASCADE RERANKING FOR PERFORMANCE)
################################################################################

[rerank.two_stage]
# Enable two-stage cascade reranking for faster processing
# Stage 1: Fast model filters to top-K candidates
# Stage 2: Precise model (from [rerank] section) ranks final results
# This can provide 3-5x speedup for large document sets (50K+ docs)
# NOTE: Stage 1 is automatically skipped if documents <= stage1_top_k
enabled = true

# Stage 1 model (fast, lightweight reranker)
# Recommended: cross-encoder/ms-marco-TinyBERT-L2-v2 (4M params, 17MB)
# This model is small enough to load on GPU alongside stage 2 model
stage1_model = cross-encoder/ms-marco-TinyBERT-L2-v2

# Device for stage 1 model (can be same as stage 2 since it's small)
# Options: cuda:0, cuda:0, cpu
stage1_device = cuda:0

# Number of top documents to keep after stage 1 filtering
# Stage 2 will rerank only these top candidates
# Recommended: 5000-10000 for good recall with significant speedup
# Higher = better recall but slower stage 2
stage1_top_k = 1024

# Minimum score threshold for stage 1 filtering
# Documents with score < stage1_min_score are filtered out BEFORE top-K selection
# Lower = more recall but slower stage 2, Higher = faster but may miss relevant docs
# Recommended: 0.0-0.2 for TinyBERT (it tends to give lower scores)
stage1_min_score = 0.5

# Minimum score threshold for stage 2 final results
# Documents with score < stage2_min_score are filtered from final output
# Lower = more results but lower precision, Higher = fewer but more relevant results
# Recommended: 0.3-0.6 for Jina reranker
stage2_min_score = 0.5

# Batch size for stage 1 model inference
# Can be larger than stage 2 since model is smaller
# Adjust based on available GPU memory
stage1_batch_size = 512

# Number of parallel workers for stage 1 reranking
# Each worker loads the stage 1 model independently
# Can have more workers than stage 2 since model is smaller
# Recommended: 5-15 for GPU
stage1_num_workers = 8

# Maximum sequence length for stage 1 model
# TinyBERT can handle shorter sequences for speed
# Typical values: 256 (fast), 512 (balanced)
stage1_max_length = 512

################################################################################
# ENTITY RERANKING (PERFORMANCE OPTIMIZATION)
################################################################################

[rerank_entity]
# Enable entity reranking to filter entities before chunk retrieval
# This reduces the number of candidate chunks and improves performance
# When enabled, entities are reranked based on their content field relevance to the query
#
# enable_stage1: Rerank Stage 1 entities (n-gram matched entities)
# enable_stage2: Rerank Stage 2 entities (semantic community discovered entities)
enable_stage1 = false
enable_stage2 = true

# Content field to use for reranking
# - "description": Use entity description field (default)
# - "content": Use entity content field (full text representation)
# - "both": Concatenate description and content
content_field = "content"

# Minimum relevance score threshold (0.0-1.0)
# Only entities with rerank score >= this threshold will be kept
# Higher values = fewer entities but more relevant
# Recommended: 0.3-0.5 for biological queries
min_score = 0.4

# Maximum number of entities to rerank (performance optimization)
# Set to 0 or negative to rerank all entities
# Recommended: 200-500 for production
max_entities = 200

# Fallback behavior when entity has no content/description
# - "use_name": Use entity name only for reranking
# - "keep": Keep entity without reranking (assume relevant)
# - "remove": Remove entity if no content available
fallback = "use_name"

################################################################################
# CACHING
################################################################################

[cache]
# Enable LLM response caching
enable_llm_cache = true

# Enable query result caching
enable_query_cache = true

# Cache TTL in seconds (time-to-live)
cache_ttl = 86400

# Cache key prefix
cache_prefix = rag_cache

################################################################################
# LOGGING
################################################################################

[logging]
# Logging level: DEBUG, INFO, WARNING, ERROR, CRITICAL
level = INFO

# Log file path (leave empty for console only)
log_file =

# Log format (note: %% is escaped for ConfigParser)
log_format = %%(asctime)s - %%(name)s - %%(levelname)s - %%(message)s

# Enable performance logging
enable_perf_logging = true

################################################################################
# ADVANCED SETTINGS
################################################################################

[advanced]
# Maximum number of concurrent database operations
max_concurrent_ops = 10

# Retry delay in seconds for failed operations
retry_delay = 1.0

# Enable query profiling
enable_profiling = false

# Profile output directory
profile_output_dir = ./profiles

################################################################################
# PROMPTS (OPTIONAL OVERRIDES)
################################################################################
# Leave empty to use default prompts from src_rag_web/llm/prompts.py

[prompts]
# System prompt for RAG response
rag_response_prompt =

# System prompt for naive query
naive_response_prompt =

# Keyword extraction prompt
keywords_extraction_prompt =

# Response type (Multiple Paragraphs, Single Paragraph, Bullet Points)
default_response_type = Multiple Paragraphs

# Default language for responses
default_language = English

################################################################################
# N-GRAM ENTITY MATCHING
################################################################################

[ngram_entity_matching]
# Enable n-gram entity matching (replaces LightRAG keyword extraction)
enable = true

# Entity statistics file for quality filtering
# Supports both TSV and CSV formats (auto-detected by extension)
# Will extract only needed columns: entity_name, pct_chunk, pct_paper
statistics_file = ./data/entity_statistics.tsv

# Quality filtering thresholds
# Entities appearing in >= max_pct_paper % of papers are filtered out
# Entities appearing in >= max_pct_chunk % of chunks are filtered out
# Entities with >= max_num_text_variations different text forms are filtered out
# These are percentages (0-100) for pct_*, and absolute counts for num_text_variations.
# High values indicate low quality (too common/too generic).
# NOTE: Entities NOT in statistics file are KEPT (assumed high quality)
# Example: max_pct_paper = 80.0 means filter entities in >= 80% of papers
#          max_num_text_variations = 2000 means filter entities with >= 2000 text variations
max_pct_paper = 25.0
max_pct_chunk = 25.0
max_num_text_variations = 50000

# N-gram generation parameters
# k_values: N-gram sizes to generate (comma-separated)
# Example: "1,2,3,4,5" generates 1-grams, 2-grams, ..., 5-grams
k_values = 1,2,3,4,5

# Minimum similarity threshold for entity matching (0.0-1.0)
# Only matches with similarity >= this value are kept
# Applied when searching entities_* collections with label_embedding
min_similarity = 0.85

# Entity collections to search (comma-separated)
# Available: genes, disease, chemical, anatomy, cell, taxonomy, go, reactome, kegg
# Leave empty to search all collections
entity_collections = Genes, Disease, Chemical, Cell_Ontology

# Caching settings
# Enable caching of n-gram matches (speeds up repeated queries)
enable_cache = true

# Maximum cache size (number of n-grams)
max_cache_size = 10000

################################################################################
# SECOND-STAGE SEMANTIC COMMUNITY ENTITY DISCOVERY
################################################################################

[second_stage_entity_discovery]
# Enable second-stage semantic community discovery
# When enabled, after Stage 1 n-gram matching, combines text snippets
# and generates ensemble queries to discover related entities
enable = true

# Number of shuffled text combinations to generate
# Higher = more robust ensemble but slower
# Recommended: 1000 for production, 100 for testing
# Note: Actual unique shuffles may be less if input is small
num_shuffles = 200

# Appearance threshold (0.0-1.0)
# Entity must appear in >= this percentage of shuffles to be included
# Example: 0.5 = entity must appear in >= 50% of shuffles
# Recommended: 0.3-0.7 (30-70%)
appearance_threshold = 0.25

# Minimum similarity for entity matching in Stage 2
# Applied when searching entity collections
# Same as Stage 1 by default
min_similarity = 0.5

# Top K entities to retrieve per shuffle query
# Higher = more candidate entities, but slower
# Recommended: 5-20
top_k = 5

# Minimum number of Stage 1 entities required to trigger Stage 2
# Skip Stage 2 if Stage 1 found too few entities (no community)
# Recommended: 2-3
min_entities = 2

# Batch size for embedding generation (number of shuffles per batch)
# Higher = faster GPU utilization but more memory
# Recommended: 100-500
embedding_batch_size = 200

# Batch size for Milvus entity search queries
# Controls how many embeddings are sent to Milvus at once
# Higher = fewer network roundtrips but more memory
# Recommended: 50-200
query_batch_size = 200

# Smart shuffling strategy to maximize unique combinations
# When number of text snippets is small, exhaustive permutations are generated
# instead of random shuffling to ensure diversity
# Options:
#   - random: Always use random shuffling (fast, may have duplicates)
#   - exhaustive: Generate all unique permutations (slow, guaranteed unique)
#   - adaptive: Use exhaustive if <= max_exhaustive_snippets, else random
shuffle_strategy = adaptive

# Maximum number of text snippets for exhaustive permutation generation
# Only used when shuffle_strategy = adaptive
# If Stage 1 finds <= this many snippets, generate all permutations
# Otherwise fall back to random shuffling
# Recommended: 5-8 (5! = 120, 6! = 720, 7! = 5040, 8! = 40320)
max_exhaustive_snippets = 5

# Minimum unique shuffle ratio (0.0-1.0)
# If unique_shuffles / num_shuffles < this ratio, log a warning
# Helps detect when shuffling isn't producing enough diversity
# Recommended: 0.7-0.9 (70-90%)
min_unique_ratio = 0.8

# Outlier removal before shuffle generation
# Enable removal of semantically unrelated snippets before generating shuffled queries
# Uses entity centroid similarity with bge-m3 embeddings
# Helps filter out instruction phrases and generic terms that contaminate shuffled queries
enable_outlier_removal = true

# Similarity threshold for outlier detection (0.0-1.0)
# Snippets with similarity < threshold to entity centroid are removed
# Based on testing: 0.60 successfully removes instruction phrases while keeping legitimate entities
# Lower = more aggressive filtering, Higher = more permissive
# Recommended: 0.55-0.65
outlier_threshold = 0.5

# Entity collections to EXCLUDE from Stage 2 lookups (comma-separated)
# Available collections: Genes, Disease, Chemical, Anatomy, Cell_Ontology, Taxonomy,
#                       Gene_Ontology, Reactome_Pathway, KEGG_Pathway, MSigDB_GeneSet
# Collection names are case-sensitive (as stored in Milvus)
# Default: Taxonomy (often too generic/noisy for Stage 2)
# Leave empty to search all collections
#
# NOTE: Can also be set via EXCLUDE_COLLECTIONS environment variable (comma-separated)
#       Environment variable values are APPENDED to the config file setting
#       Example: export EXCLUDE_COLLECTIONS="MSigDB_GeneSet,KEGG_Pathway"
#       Result: Taxonomy, Genes, Anatomy, Chemical, MSigDB_GeneSet, KEGG_Pathway
exclude_collections = Taxonomy, Genes, Anatomy, Chemical
################################################################################
# ELASTICSEARCH FULL TEXT SEARCH
################################################################################

[elasticsearch]
# Enable Elasticsearch for full text search
enabled = true

# Connection settings
hosts = http://localhost:9200
username =
password =

# Index settings
index_name = lightrag_chunks
number_of_shards = 3
number_of_replicas = 1

# Search settings
default_fuzziness = AUTO

# Maximum result window for pagination (default: 10000)
# Will be set automatically on app initialization
max_result_window = 100000
default_operator = or

# Timeouts
timeout = 30
max_retries = 3

################################################################################
# HYBRID SEARCH (ELASTICSEARCH + MILVUS)
################################################################################

[hybrid_search]
# Enable hybrid search (Elasticsearch + Milvus)
# When enabled, queries use both BM25 keyword matching and semantic vector search
enabled = true

# Keyword expansion settings
# Uses LLM to generate synonyms and related terms for better keyword matching
enable_keyword_expansion = true
max_keywords = 50
keyword_cache_ttl = 86400

# Retrieval budgets (ES and Milvus search in parallel, independent budgets)
# These are SEPARATE from [query] section's top_k (which controls KG entities)
es_top_k = 5000

# Top-K per query for multi-query ES search (when using expansions + HyDE)
es_top_k_per_query = 1000

milvus_top_k = 5000
merged_top_k = 5000

# ES multi-query search strategy
# When enabled, uses query expansions + HyDE for ES search instead of keyword expansion
# This eliminates one LLM call and provides semantic consistency with Milvus
use_query_expansions_for_es = true

# RRF (Reciprocal Rank Fusion) parameters
# RRF formula: score = sum(1 / (rrf_k + rank))
# Higher rrf_k = less aggressive rank normalization
rrf_k = 60

# Fallback behavior
# If Elasticsearch errors, fall back to semantic-only search
fallback_to_semantic_on_es_error = true
